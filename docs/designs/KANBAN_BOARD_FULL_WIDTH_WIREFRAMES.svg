  <text x="84" y="422" class="tiny">Width: 240px (expanded)</text>

  <rect class="main" x="282" y="252" width="644" height="474" />
  <text x="298" y="278" class="label">Execution Board</text>
  <text x="298" y="296" class="tiny">Product: Mobile App &#xB7; Board: Delivery team</text>
  <rect class="button" x="750" y="262" width="88" height="26" />
