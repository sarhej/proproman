<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="2100" viewBox="0 0 1920 2100">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .page { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .header { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .sidebar { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; ry: 12; }
      .sidebar-collapsed { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; ry: 8; }
      .main { fill: #f8fafc; }
      .title { font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; }
      .section { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .label { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #334155; }
      .text { font-family: Arial, sans-serif; font-size: 13px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #475569; }
      .tiny { font-family: Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .accent { fill: #0ea5e9; }
      .good { fill: #16a34a; }
      .warn { fill: #d97706; }
      .chip { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1; rx: 12; ry: 12; }
      .chip-accent { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 1; rx: 12; ry: 12; }
      .button { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 8; ry: 8; }
      .button-primary { fill: #0f172a; stroke: #0f172a; stroke-width: 1.2; rx: 8; ry: 8; }
      .column { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; ry: 12; }
      .column-wide { fill: #f0f9ff; stroke: #7dd3fc; stroke-width: 1.5; rx: 12; ry: 12; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; ry: 10; }
      .note { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.2; rx: 12; ry: 12; }
      .note-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.2; rx: 12; ry: 12; }
      .scroll-fade { fill: url(#fadeRight); }
      .nav-active { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 1; rx: 6; ry: 6; }
      .nav-item { fill: #ffffff; stroke: none; }
      .connector { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 4; }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
      .highlight-zone { fill: none; stroke: #0ea5e9; stroke-width: 2; stroke-dasharray: 8 4; rx: 8; ry: 8; }
    </style>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.95" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="2100" />
  <text x="60" y="52" class="title">Execution Board &#x2014; Full-Width Kanban Layout</text>
  <text x="60" y="78" class="text">Wireframes for collapsible sidebar, fluid board width, and content-aware column sizing with horizontal scroll overflow.</text>
  <text x="60" y="98" class="small">Design doc: docs/designs/KANBAN_BOARD_FULL_WIDTH_DESIGN.md &#xB7; Desktop focus (lg+)</text>

  <!-- STATE 1: Sidebar expanded -->
  <rect class="page" x="50" y="130" width="900" height="620" />
  <text x="75" y="162" class="section">State A. Sidebar expanded &#x2014; columns distribute</text>
  <text x="75" y="184" class="small">Few columns: each grows equally up to max-width; board uses full main area (no 1600px cap).</text>

