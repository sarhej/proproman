  <text x="436" y="358" class="tiny">27</text>
  <rect class="card" x="308" y="378" width="176" height="72" />
  <text x="318" y="398" class="tiny">REQ-101 OAuth refresh</text>
  <text x="318" y="414" class="tiny">Feature: Auth</text>
  <rect class="card" x="308" y="458" width="176" height="72" />
  <text x="318" y="478" class="tiny">REQ-102 Push notifications</text>

  <rect class="column-wide" x="506" y="338" width="196" height="360" />
  <text x="520" y="362" class="label">Backlog</text>
  <rect class="chip" x="638" y="346" width="22" height="18" />
  <text x="644" y="358" class="tiny">4</text>
  <rect class="card" x="516" y="378" width="176" height="72" />
  <text x="526" y="398" class="tiny">REQ-14 SAML setup</text>

  <rect class="column-wide" x="714" y="338" width="196" height="360" />
  <text x="728" y="362" class="label">In Progress</text>
  <rect class="chip-accent" x="860" y="346" width="22" height="18" />
  <text x="866" y="358" class="tiny">6</text>
  <rect class="card" x="724" y="378" width="176" height="72" />
  <text x="734" y="398" class="tiny">REQ-22 Tenant migration</text>

  <text x="298" y="718" class="tiny">flex-1 columns &#xB7; min 220px &#xB7; max 420px &#xB7; equal leftover distribution</text>

  <!-- STATE 2: Sidebar collapsed -->
  <rect class="page" x="970" y="130" width="900" height="620" />
  <text x="995" y="162" class="section">State B. Sidebar collapsed &#x2014; reclaimed width</text>
  <text x="995" y="184" class="small">Icon rail (56px) + wider columns; toggle on sidebar edge; state persisted in localStorage.</text>

  <rect class="header" x="994" y="200" width="852" height="44" />
  <text x="1010" y="228" class="label">Tymio</text>

  <rect class="sidebar-collapsed" x="994" y="252" width="56" height="474" />
  <rect class="button" x="1002" y="262" width="40" height="28" />
  <text x="1014" y="280" class="tiny">&#x203A;</text>
